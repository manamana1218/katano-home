<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATANO DESIGN | 制作実績とサービス</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #333;
      line-height: 1.6;
    }
    header {
      background-color: #f1f1f1;
      text-align: center;
      padding: 40px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    section {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h2 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 30px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
    }
    .gallery div {
      flex: 1 1 250px;
      max-width: 300px;
      text-align: center;
    }
    footer {
      background-color: #f1f1f1;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>KATANO DESIGN</h1>
    <p>やさしく伝わるデザインでお手伝いします</p>
  </header>

  <section>
    <h2>ご提供しているサービス</h2>
    <ul>
      <li>チラシ・ポスター制作</li>
      <li>名刺・ショップカード</li>
      <li>地域活動向け印刷物</li>
    </ul>
  </section>

  <section>
    <h2>制作実績（一部）</h2>
    <div class="gallery">
      <div>
        <img src="images/片野チラシ.jpg" alt="片野チラシ">
        <p>チラシ制作ご案内</p>
      </div>
      <div>
        <img src="images/Shop card COFFEE (1).png" alt="ショップカード（カフェ）">
        <p>ショップカード（カフェ）</p>
      </div>
      <div>
        <img src="images/2.png" alt="夏祭りポスター">
        <p>地域イベントポスター</p>
      </div>
    </div>
  </section>

  <section>
    <h2>お問い合わせはLINEで</h2>
    <p style="text-align: center;">QRコードからお気軽にご連絡ください</p>
    <p style="text-align: center;">
      <img src="images/lineqr.png" alt="LINE QRコード" style="width: 200px;">
    </p>
  </section>

  <footer>
    <p>&copy; 2025 KATANO DESIGN</p>
  </footer>

</body>
</html>
